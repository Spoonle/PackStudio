name: Build & Verify (Minecraft 26.3)

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gradle Clean Build (JDK 25 / MC 26.3)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run clean Fabric Loom build & JUnit 5 suite
        id: gradle_build
        run: |
          set +e
          ./gradlew clean build --no-daemon > gradle-build.log 2>&1
          EXIT_CODE=$?
          cat gradle-build.log
          if [ $EXIT_CODE -ne 0 ]; then
            SUMMARY=$(grep -E -A 3 "error:|FAILED|Exception|Caused by:|What went wrong" gradle-build.log | tail -n 60 | tr '\n' '|' | cut -c1-3500)
            echo "::error title=GradleBuildFailed::$SUMMARY"
            exit $EXIT_CODE
          fi
          TAIL_OK=$(tail -n 20 gradle-build.log | tr '\n' '|' | cut -c1-2000)
          echo "::notice title=GradleBuildSucceeded::$TAIL_OK"

      - name: Verify JAR contents, fabric.mod.json, and 26.3 bytecode descriptors
        run: |
          set -euo pipefail
          MAIN_JAR=$(ls build/libs/packstudio-*.jar | grep -v '\-sources\.jar$' | head -n 1)
          SOURCES_JAR=$(ls build/libs/packstudio-*-sources.jar | head -n 1)

          if javap -cp "$MAIN_JAR" -c -v com.packstudio.manager.PackRepositoryManager | grep -q "backgroundExecutor"; then
            echo "::error title=BytecodeAudit::PackRepositoryManager still references Util.backgroundExecutor"
            exit 1
          fi
          if javap -cp "$MAIN_JAR" -c -v com.packstudio.manager.PackIconCache | grep -q "backgroundExecutor"; then
            echo "::error title=BytecodeAudit::PackIconCache still references Util.backgroundExecutor"
            exit 1
          fi

          (cd build/libs && sha256sum "$(basename "$MAIN_JAR")" "$(basename "$SOURCES_JAR")" > SHA256SUMS.txt)
          SUMS=$(cat build/libs/SHA256SUMS.txt | tr '\n' '|')
          MOD_JSON=$(unzip -p "$MAIN_JAR" fabric.mod.json | tr '\n' ' ' | tr -s ' ')
          echo "::notice title=VerifiedArtifacts::SHA256=$SUMS | fabric.mod.json=$MOD_JSON"

      - name: Sync verified Loom JARs to releases/ on active working branch
        if: startsWith(github.ref_name, 'arena/') && github.event_name == 'push'
        run: |
          MAIN_JAR=$(ls build/libs/packstudio-*.jar | grep -v '\-sources\.jar$' | head -n 1)
          SOURCES_JAR=$(ls build/libs/packstudio-*-sources.jar | head -n 1)
          cp "$MAIN_JAR" "releases/$(basename "$MAIN_JAR")"
          cp "$SOURCES_JAR" "releases/$(basename "$SOURCES_JAR")"
          cp build/libs/SHA256SUMS.txt releases/SHA256SUMS.txt
          if ! git diff --quiet releases/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add releases/
            git commit -m "chore(release): update prebuilt 26.3 JARs from verified Fabric Loom build [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload Built JARs
        uses: actions/upload-artifact@v4
        with:
          name: packstudio-mc26.3-jars
          path: |
            build/libs/packstudio-*.jar
            build/libs/SHA256SUMS.txt

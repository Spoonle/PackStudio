name: Build & Verify (Minecraft 26.3)

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gradle Clean Build (JDK 25 / MC 26.3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run clean Fabric Loom build & JUnit 5 suite
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Verify JAR contents, fabric.mod.json, and 26.3 bytecode descriptors
        run: |
          set -euo pipefail
          MAIN_JAR=$(ls build/libs/packstudio-*.jar | grep -v '\-sources\.jar$' | head -n 1)
          SOURCES_JAR=$(ls build/libs/packstudio-*-sources.jar | head -n 1)
          echo "Main JAR: $MAIN_JAR"
          echo "Sources JAR: $SOURCES_JAR"

          echo "=== JAR entries ==="
          jar tf "$MAIN_JAR"

          echo "=== Expanded fabric.mod.json ==="
          unzip -p "$MAIN_JAR" fabric.mod.json

          echo "=== Bytecode descriptor audit ==="
          if javap -cp "$MAIN_JAR" -c -v com.packstudio.manager.PackRepositoryManager | grep -q "backgroundExecutor"; then
            echo "ERROR: PackRepositoryManager still references Util.backgroundExecutor!"
            exit 1
          fi
          if javap -cp "$MAIN_JAR" -c -v com.packstudio.manager.PackIconCache | grep -q "backgroundExecutor"; then
            echo "ERROR: PackIconCache still references Util.backgroundExecutor!"
            exit 1
          fi
          javap -cp "$MAIN_JAR" -p com.packstudio.core.PackStudioExecutors
          javap -cp "$MAIN_JAR" -p com.packstudio.client.screen.components.GlassButton
          javap -cp "$MAIN_JAR" -p com.packstudio.client.screen.components.GlassTabButton
          javap -cp "$MAIN_JAR" -c com.packstudio.client.screen.panels.OverviewPanel | grep -E "RenderPipelines|GUI_TEXTURED|blit" | head -n 10

          echo "=== SHA256 Checksums ==="
          (cd build/libs && sha256sum "$(basename "$MAIN_JAR")" "$(basename "$SOURCES_JAR")" | tee SHA256SUMS.txt)

      - name: Emit Base64 Artifacts for Reproducible Retrieval
        run: |
          MAIN_JAR=$(ls build/libs/packstudio-*.jar | grep -v '\-sources\.jar$' | head -n 1)
          SOURCES_JAR=$(ls build/libs/packstudio-*-sources.jar | head -n 1)
          echo "===BEGIN_MAIN_JAR_B64==="
          base64 -w 0 "$MAIN_JAR"
          echo ""
          echo "===END_MAIN_JAR_B64==="
          echo "===BEGIN_SOURCES_JAR_B64==="
          base64 -w 0 "$SOURCES_JAR"
          echo ""
          echo "===END_SOURCES_JAR_B64==="

      - name: Upload Built JARs
        uses: actions/upload-artifact@v4
        with:
          name: packstudio-mc26.3-jars
          path: |
            build/libs/packstudio-*.jar
            build/libs/SHA256SUMS.txt

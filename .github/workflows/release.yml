name: Publish Release Assets

on:
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach freshly built JAR assets to"
        required: true
        default: "v1.0.0+mc26.3"

permissions:
  contents: write

jobs:
  build-and-attach-assets:
    name: Build & Attach JARs to GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build genuine Fabric Loom 26.3 JARs
        run: |
          ./gradlew clean build --no-daemon --stacktrace
          cd build/libs
          MAIN_JAR=$(ls packstudio-*.jar | grep -v '\-sources\.jar$' | head -n 1)
          SOURCES_JAR=$(ls packstudio-*-sources.jar | head -n 1)
          sha256sum "$MAIN_JAR" "$SOURCES_JAR" > SHA256SUMS.txt

      - name: Upload JAR & Checksum Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${EVENT_TAG:-${INPUT_TAG:-v1.0.0+mc26.3}}"
          MAIN_JAR=$(ls build/libs/packstudio-*.jar | grep -v '\-sources\.jar$' | head -n 1)
          SOURCES_JAR=$(ls build/libs/packstudio-*-sources.jar | head -n 1)
          gh release upload "$TAG" \
            "${MAIN_JAR}#$(basename "$MAIN_JAR")" \
            "${SOURCES_JAR}#$(basename "$SOURCES_JAR")" \
            "build/libs/SHA256SUMS.txt#SHA256SUMS.txt" \
            --clobber

name: DIAG 26.1 compile

on:
  push:
    paths:
      - "tools/diag-26.1.yml"
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile 26.1 and dump full diagnostics
        run: |
          set +e
          ./gradlew clean compileJava compileTestJava --no-daemon -Pminecraft_version=26.1 > diag.log 2>&1
          cat diag.log
          exit 0
      - name: Extract compiler diagnostics
        run: |
          grep -nE "error:|symbol:|location:|required:|found:|reason:" diag.log | head -120 | tr '\n' '|'
          echo
          echo "---- annotations payloads ----"
          grep -E "^/home/runner" diag.log | head -40

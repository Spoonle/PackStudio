plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def modVersion = project.version
	def minecraftVersion = project.minecraft_version
	def loaderVersion = project.loader_version

	inputs.property 'version', modVersion
	inputs.property 'minecraft_version', minecraftVersion
	inputs.property 'loader_version', loaderVersion

	filesMatching('fabric.mod.json') {
		expand(
			'version': modVersion,
			'minecraft_version': minecraftVersion,
			'loader_version': loaderVersion
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

tasks.named('test', Test) {
	useJUnitPlatform()
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def archiveName = project.base.archivesName.get()
	inputs.property 'archivesName', archiveName

	from('LICENSE') {
		rename { "${it}_${archiveName}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
